name: CI Quality & Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-test:
    name: Build, Typecheck & Critical Regression Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Build Verification
        run: npm run build

      - name: Run Automated Critical Regression Tests
        env:
          NODE_ENV: test
          IS_TESTING: "true"
        run: npm run test
