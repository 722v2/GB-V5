services:
  - type: web
    name: gold-ai-challenge-scanner
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_RUNTIME_MODE
        value: production
      - key: ENABLE_INTERNAL_SCANNER
        value: "true"
      - key: SCANNER_TRIGGER_MODE
        value: interval
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: NVIDIA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_CONFIG
        sync: false
      - key: MT5_BRIDGE_TOKEN
        sync: false
      - key: MT5_MAGIC_NUMBER
        value: "240726"
      - key: MT5_ALLOWED_SYMBOLS
        value: "XAUUSD,GOLD,XAUUSDm,XAUUSD.a,XAUUSD.raw,XAUUSDb"
